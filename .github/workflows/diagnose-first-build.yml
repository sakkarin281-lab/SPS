name: Diagnose SPS APK build failure

on:
  push:
    paths:
      - '.github/workflows/diagnose-first-build.yml'
  workflow_dispatch:

permissions:
  actions: read
  issues: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect logs from the original failed build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runid=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-apks.yml/runs?per_page=50" --jq '.workflow_runs[] | select(.run_number >= 2) | .id' | head -n 1)
          if [[ -z "$runid" ]]; then
            echo 'No new build run was found'; exit 1
          fi
          echo "# SPS Android APKs: most recent build diagnostic" > /tmp/report.md
          echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${runid}" >> /tmp/report.md
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${runid}/jobs?per_page=100" --jq '.jobs[] | select(.conclusion == "failure") | [.id, .name] | @tsv' > /tmp/jobs.tsv
          while IFS=$'\t' read -r jobid jobname; do
            echo "" >> /tmp/report.md
            echo "## Failed job: ${jobname}" >> /tmp/report.md
            echo '~~~text' >> /tmp/report.md
            if gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${jobid}/logs" > /tmp/job.log; then
              grep -Ein 'error|failure|exception|failed|fatal|unable|denied|not found|could not|exit code' /tmp/job.log | tail -n 22 | cut -c 1-230 >> /tmp/report.md || true
              echo '--- Final log lines ---' >> /tmp/report.md
              tail -n 40 /tmp/job.log | sed -E 's/(token|password|authorization|secret)=[^[:space:]]+/\1=[REDACTED]/Ig' | cut -c 1-230 >> /tmp/report.md
            else
              echo 'Failed to fetch job logs.' >> /tmp/report.md
            fi
            echo '~~~' >> /tmp/report.md
          done < /tmp/jobs.tsv
          head -c 28000 /tmp/report.md > /tmp/report-public.md
          gh issue comment 1 -R "$GITHUB_REPOSITORY" --body-file /tmp/report-public.md
