name: Build S.P. School Android APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: WebView
            project: 01_SP_School_WebView
            artifact: SP-School-WebView-debug-APK
          - label: Native
            project: 02_SP_School_Native
            artifact: SP-School-Native-debug-APK
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack source files
        shell: bash
        run: |
          echo "d194fcd7b7d9ea780504881c134c10c48a7df54b9f10cf4e740a39cc1fa4e4f7  SP_School_GitHub_APK_Ready.zip" | sha256sum -c -
          mkdir -p source
          unzip -q SP_School_GitHub_APK_Ready.zip -d source
          test -f "source/${{ matrix.project }}/app/build.gradle"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: source/${{ matrix.project }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: test -s "source/${{ matrix.project }}/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: source/${{ matrix.project }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
